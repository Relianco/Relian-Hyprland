name: secret-scan

# Scans the full git history and the checked-out files for leaked secrets with betterleaks (https://github.com/betterleaks/betterleaks).
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: new detection rules also catch old commits
  workflow_dispatch:

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: "1.9.0"

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, not just the latest commit

      - name: Install betterleaks (pinned version, checksum verified)
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          file="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$file" "$base/$file"
          curl -fsSL -o checksums.txt "$base/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" betterleaks
          sudo install -m 0755 betterleaks /usr/local/bin/betterleaks

      - name: Scan git history
        run: betterleaks git --redact --no-banner -v .

      - name: Scan files
        run: betterleaks dir --redact --no-banner .
