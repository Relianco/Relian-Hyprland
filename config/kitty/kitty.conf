# /* ---- Relian-Hyprland ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/01-Wallust.conf

font_family JetBrainsMono Nerd Font
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 0

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 14

selection_foreground none
selection_background none


# Omarchy-style cursor: plain block, no blinking, no trail
cursor_shape block
cursor_blink_interval 0

# Remote control over a private socket: lets the SUPER+CTRL+O "toggle opacity" bind switch a terminal between its
# transparent background and fully opaque (Hyprland's own opaque switch cannot change kitty's built-in transparency).
allow_remote_control socket-only
listen_on unix:@kitty
